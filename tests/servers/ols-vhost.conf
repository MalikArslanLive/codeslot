docRoot /var/www/html/
index {
  useServer 0
  indexFiles index.php
}
rewrite {
  enable 1
  autoLoadHtaccess 0
  rules <<<END_rules
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule . /index.php [L]
END_rules
}

phpIniOverride {
  php_flag log_errors On
  php_value error_log /tmp/codeslot-php-error.log
}
