serverName codeslot-disposable
user nobody
group nogroup
mime conf/mime.properties
errorlog /usr/local/lsws/logs/error.log {
  logLevel WARN
  enableStderrLog 1
}
indexFiles index.php
extProcessor lsphp {
  type lsapi
  address uds://tmp/lshttpd/codeslot.sock
  maxConns 5
  env PHP_LSAPI_CHILDREN=5
  env WORDPRESS_DB_HOST=db
  env WORDPRESS_DB_USER=wordpress
  env WORDPRESS_DB_PASSWORD=disposable-local-only
  env WORDPRESS_DB_NAME=wordpress
  env WORDPRESS_DEBUG=1
  initTimeout 60
  retryTimeout 0
  persistConn 1
  respBuffer 0
  autoStart 1
  path /usr/local/lsws/fcgi-bin/lsphp
  instances 1
}
scriptHandler {
  add lsapi:lsphp php
}
virtualHost codeslot {
  vhRoot /var/www/html/
  allowSymbolLink 1
  enableScript 1
  restrained 0
  configFile /usr/local/lsws/conf/codeslot-vhost.conf
}
listener HTTP {
  address *:8088
  secure 0
  map codeslot *
}
CGIRLimit {
  maxCGIInstances 20
  minUID 11
  minGID 10
}
accessLog /usr/local/lsws/logs/access.log {
  rollingSize 10M
}
tuning {
  maxConnections 1000
}
